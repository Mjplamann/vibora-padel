<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Víbora Padel — venues</title>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #050608; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.3 ui-monospace, monospace; color: #8fa3b8; opacity: 0.8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
// Venue viewer: ?venue=club|sunset|stadium  ?view=baseline|net|overview|side|glass|crowd|sky|feet
// ?quality=ultra|high|balanced  ?frames=N  ?react=applause|roar|ooh|groan|wave  ?t=seconds (animation time)
import * as THREE from 'three';
import { createRenderer } from '../src/render/scene.js';
import { buildEnvironment } from '../src/render/environment.js';
import { createEffects } from '../src/render/effects.js';
import { createBallView } from '../src/render/ballView.js';
import { loadFonts } from '../src/render/textures.js';

const qs = new URLSearchParams(location.search);
const view = qs.get('view') || 'baseline';
const quality = qs.get('quality') || 'high';
const venue = qs.get('venue') || 'club';
const frames = Number(qs.get('frames') || 3);
const live = qs.get('live') === '1';
const aoOff = qs.get('ao') === '0';

await loadFonts();
const canvas = document.getElementById('c');
const app = createRenderer(canvas, { quality, dynamicResolution: live });
app.resize(innerWidth, innerHeight);
addEventListener('resize', () => app.resize(innerWidth, innerHeight));
const t0 = performance.now();
const env = buildEnvironment(app.scene, app.renderer, { quality, venue, debug: true });
if (aoOff && app.aoPass) app.aoPass.enabled = false;
if (qs.get('aodebug') && app.aoPass) app.aoPass.compMat.uniforms.uDebug.value = Number(qs.get('aodebug'));
const buildMs = Math.round(performance.now() - t0);
const fx = createEffects(app.scene, { net: env.net });
const ballView = createBallView(app.scene, {});
window.env = env;
window.app = app;

const cam = app.camera;
const fp = (x, z, yaw = 0, pitch = -14, fov = 74) => () => {
  cam.fov = fov;
  cam.position.set(x, 1.64, z);
  cam.rotation.order = 'YXZ';
  cam.rotation.set(THREE.MathUtils.degToRad(pitch), THREE.MathUtils.degToRad(yaw), 0);
};
const look = (p, t, fov) => () => {
  cam.fov = fov;
  cam.position.set(...p);
  cam.lookAt(...t);
};
const views = {
  baseline: fp(2.3, 8.3),
  net: fp(1.2, 2.6, 0, -10),
  left: fp(2.3, 8.3, 45, -6),
  right: fp(-2.3, 8.3, -40, -6),
  back: fp(0.5, 3, 180, -8),
  overview: look([0, 9.5, 21], [0, 0.5, -2], 55),
  side: look([-13, 4.0, 4], [0, 1.0, -1.5], 55),
  high: look([16, 14, 22], [0, 0, -2], 50),
  crowd: look([3, 1.7, 6], [14, 4, -2], 60),
  stand: look([4.5, 2.2, 2], [13, 3.5, 0], 50),
  ball: look([0.55, 1.5, 4.55], [0.92, 1.52, 4.0], 30),
  pane: look([2.0, 1.3, 7.6], [2.6, 1.2, 10], 55),
  glass: look([3.4, 1.5, 7.2], [5, 1.2, 9.6], 60),
  feet: look([2.3, 1.64, 7.8], [2.3, 0, 6.2], 70),
  people: look([-4.2, 1.1, -1.0], [-6.6, 0.85, -1.4], 40),
  bar: look([0, 1.5, -9.0], [0, 1.2, -14], 50),
  post: look([4.1, 1.0, 1.6], [5.6, 0.2, -0.2], 55),
  umpire: look([-3.2, 1.5, 3.4], [-6.4, 1.5, 0], 50),
};
(views[view] || views.baseline)();
cam.updateProjectionMatrix();
cam.updateMatrixWorld();
/** Test hook: switch view, advance the animation by t seconds (optionally after a reaction), render twice. */
window.shot = (name, { react: r = null, t = 0, venue: v = null } = {}) => {
  if (v) env.setVenue(v);
  (views[name] || views.baseline)();
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld();
  if (r) env.react(r, 1);
  for (let i = 0; i < Math.round(t * 30); i++) env.update(1 / 30, cam);
  app.render(1 / 60);
  app.render(1 / 60);
  const st = app.stats;
  hud.textContent = `${env.venue.id} · ${name} · ${app.quality} · draws ${st.drawCalls} · tris ${(st.triangles / 1000).toFixed(0)}k`;
  return { venue: env.venue.id, view: name, drawCalls: st.drawCalls, triangles: st.triangles, frameMs: Math.round(st.frameMs * 10) / 10 };
};

// A ball in flight for scale.
const ball = { pos: { x: 1.05, y: 1.32, z: 2.4 }, vel: { x: -2, y: 3, z: 24 }, spin: { x: 40, y: 0, z: 0 }, id: 1, atRest: false };
if (qs.get('ball') !== '0') {
  for (let i = 0; i < 8; i++) {
    ball.pos.x += ball.vel.x / 120; ball.pos.y += ball.vel.y / 120; ball.pos.z += ball.vel.z / 120;
    ballView.update(ball, 1 / 120, 1);
  }
}
const react = qs.get('react');
let tAnim = Number(qs.get('t') || 0);
if (react) env.react(react, 1);
const steps = Math.round(tAnim * 30);
for (let i = 0; i < steps; i++) env.update(1 / 30, cam);
fx.update(1 / 60);

const hud = document.getElementById('hud');
let n = 0;
let last = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (live) { env.update(dt, cam); fx.update(dt); }
  app.render(live ? dt : 1 / 60);
  n++;
  const s = app.stats;
  hud.textContent = `${venue} · ${view} · ${app.quality} · build ${buildMs} ms · draws ${s.drawCalls} · tris ${(s.triangles / 1000).toFixed(0)}k · frame ${s.frameMs.toFixed(1)} ms · pr ${s.pixelRatio}`;
  if (n === frames) {
    window.__stats = { venue, view, quality, drawCalls: s.drawCalls, triangles: s.triangles, buildMs, frameMs: Math.round(s.frameMs * 10) / 10,
      programs: app.renderer.info.programs ? app.renderer.info.programs.length : null, textures: app.renderer.info.memory.textures, geometries: app.renderer.info.memory.geometries };
    console.log('VENUE', JSON.stringify(window.__stats));
    window.__ready = true;
    if (qs.get('hud') === '0') hud.remove();
  }
  if (live || n < frames) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
