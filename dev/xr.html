<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Víbora Padel — glasses (stereo / head tracking)</title>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #050608; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #log { position: fixed; left: 8px; bottom: 6px; font: 11px/1.3 ui-monospace, monospace; color: #8fa3b8; opacity: 0.85; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="log"></div>
<script type="module">
// Dev page for the VITURE glasses mode (src/xr/). Renders the court through the real stage
// pieces (renderer, environment, first-person camera with the app.xr contract) with:
//   ?stereo=on|off   side-by-side stereo (layout chosen from the viewport: 3840×1200 full, 1920×1200 half)
//   ?yaw=deg         head yaw for the picture (simulated glasses, V2 protocol through the real driver)
//   ?pitch=deg       head pitch
//   ?sweep=1         also sweeps the head yaw -60°..+60° and checks the camera follows it
//   ?quality=balanced|high   ?protocol=v2|legacy   ?hud=0
// Results: window.__xr (eye-order check from the asymmetric marker, sweep samples); window.__ready.
import * as THREE from 'three';
import { createRenderer } from '../src/render/scene.js';
import { buildEnvironment } from '../src/render/environment.js';
import { createFirstPersonCamera } from '../src/render/fpCamera.js';
import { loadFonts } from '../src/render/textures.js';
import { createGlasses } from '../src/xr/glasses.js';
import { createStereoRenderer } from '../src/xr/stereo.js';
import { createSimulatedGlasses } from '../src/xr/sim.js';
import { qFromEulerYXZ } from '../src/xr/quat.js';

const qs = new URLSearchParams(location.search);
const stereoOn = qs.get('stereo') !== 'off';
const quality = qs.get('quality') || 'balanced';
const yawDeg = Number(qs.get('yaw') || 0);
const pitchDeg = Number(qs.get('pitch') || 0);
const DEG = Math.PI / 180;
const log = (s) => { document.getElementById('log').textContent += `${s}\n`; };

await loadFonts();
const canvas = document.getElementById('c');
const app = createRenderer(canvas, { quality, dynamicResolution: false });
app.resize(innerWidth, innerHeight);
const env = buildEnvironment(app.scene, app.renderer, { quality });
env.setOpponentsVisible(false);

// ---- asymmetric test objects ---------------------------------------------------------
const EYE = new THREE.Vector3(0, 1.64, 8.0);
// Near magenta post 0.8 m in front of the eye: in the LEFT eye it must appear right of centre,
// in the RIGHT eye left of centre (crossed disparity of a near object).
const marker = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.24, 0.035), new THREE.MeshBasicMaterial({ color: 0xff00ff, toneMapped: false }));
marker.position.set(0, EYE.y - 0.02, EYE.z - 0.8);
app.scene.add(marker);
// Signs: LEFT on the left (x < 0), RIGHT on the right, so a mirrored eye image is obvious.
function sign(text, color, x) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 192;
  const c = cv.getContext('2d');
  c.fillStyle = color; c.fillRect(0, 0, 512, 192);
  c.fillStyle = '#fff'; c.font = '900 120px "Big Shoulders Display", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, 256, 100);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.6), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  m.position.set(x, 2.1, 2.5);
  app.scene.add(m);
  return m;
}
sign('← LEFT', '#c8263c', -2.2);
sign('RIGHT →', '#2a5aa6', 2.2);
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.0325 * 2.5, 24, 16), new THREE.MeshBasicMaterial({ color: 0xdcf53c, toneMapped: false }));
ball.position.set(0.6, 1.3, 4.5);
app.scene.add(ball);

// ---- simulated glasses -> real driver -> glasses controller -> app.xr ------------------
let head = qFromEulerYXZ(0, 0, 0, {});
const sim = createSimulatedGlasses({ protocol: qs.get('protocol') === 'legacy' ? 'legacy' : 'v2', pose: () => head });
const glasses = createGlasses({
  storage: null, hid: sim.hid, createStereo: (o) => createStereoRenderer(o),
  viewport: () => ({ width: innerWidth, height: innerHeight }),
});
glasses.enable(true, { persist: false });
glasses.set({ stereo: stereoOn ? 'on' : 'off', headTracking: true, profile: 'auto' }, { persist: false });
glasses.setPlaying(true);
glasses.driver.setConfig({ predictMs: 0, smoothing: 'off' });
const connecting = glasses.connect();
const pump = setInterval(() => sim.emit(performance.now()), 8);
await connecting;
glasses.recenter();
if (qs.get('hud') !== '0') {
  glasses.xr.hud.update({
    title: 'Off the Back Glass', repIndex: 7, repTotal: 20, points: 140, streak: 3,
    miss: { text: 'Swing was 0.3 s late', at: 1 }, prompt: 'Let it come off the glass — swing on “now!”',
  });
}

// The stage's integration surface: app.xr read live by the first-person camera.
app.xr = glasses.active;
const viewSettings = { fov: 74, gazeFollow: true, viewPitch: -14, eyeOffset: { back: 0.12, down: 0.06 } };
const fpCam = createFirstPersonCamera(app.camera, viewSettings, { getXR: () => app.xr });
fpCam.mode = 'fp';
fpCam.snap();
const world = { player: { eye: { x: EYE.x, y: EYE.y, z: EYE.z }, pos: { x: 0, y: 0, z: EYE.z }, height: 1.75 }, ball: null, mode: null };

function setHead(yaw, pitch = 0) {
  head = qFromEulerYXZ(yaw * DEG, pitch * DEG, 0, {});
  for (let i = 0; i < 4; i++) sim.emit(performance.now());
}

function frame() {
  const xr = app.xr;
  // Head tracking replaces the TV framing offset (boot.js frame() does this in the app).
  viewSettings.eyeOffset = (xr && xr.eyeOffset) || { back: 0.12, down: 0.06 };
  fpCam.update(world, 1 / 60);
  const st = xr && xr.stereo;
  if (st && st.enabled) st.render(app.renderer, app.scene, app.camera, app.composer);
  else app.render(1 / 60);
}

/** Centroid x (0..1 within each half) of the magenta marker, read right after a render. */
function markerCentroids() {
  const gl = app.renderer.getContext();
  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  const px = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const half = Math.floor(w / 2);
  const acc = [{ n: 0, sx: 0 }, { n: 0, sx: 0 }];
  for (let y = 0; y < h; y += 2) {
    for (let x = 0; x < w; x += 1) {
      const i = (y * w + x) * 4;
      if (px[i] > 200 && px[i + 1] < 70 && px[i + 2] > 200) {
        const k = x < half ? 0 : 1;
        acc[k].n++;
        acc[k].sx += k ? (x - half) / (w - half) : x / half;
      }
    }
  }
  return acc.map((a) => (a.n ? { x: a.sx / a.n, n: a.n } : null));
}

const result = { stereo: stereoOn, viewport: [innerWidth, innerHeight], layout: null, eyeOrder: null, sweep: [], errors: [] };

// 1) Eye-order check at yaw 0.
setHead(0, 0);
frame();
if (stereoOn) {
  const c = markerCentroids();
  result.markers = c;
  result.layout = glasses.xr.stereo.stats && glasses.xr.stereo.stats.layout;
  result.eyeSize = glasses.xr.stereo.stats ? [glasses.xr.stereo.stats.eyeWidth, glasses.xr.stereo.stats.eyeHeight] : null;
  result.eyeOrder = c[0] && c[1] ? (c[0].x > 0.5 && c[1].x < 0.5 ? 'ok' : 'SWAPPED') : 'marker-not-found';
  log(`layout ${result.layout} eye ${result.eyeSize} · marker L ${c[0] && c[0].x.toFixed(3)} R ${c[1] && c[1].x.toFixed(3)} -> ${result.eyeOrder}`);
}
result.fov = app.camera.fov;

// 2) Head-yaw sweep through the contract: commanded yaw vs the camera's actual heading.
if (qs.get('sweep') === '1') {
  const dir = new THREE.Vector3();
  for (let yaw = -60; yaw <= 60; yaw += 15) {
    setHead(yaw, 0);
    fpCam.update(world, 1 / 60);
    app.camera.getWorldDirection(dir);
    const camYaw = Math.atan2(-dir.x, -dir.z) / DEG; // + = looking left
    result.sweep.push({ yaw, camYaw: Math.round(camYaw * 10) / 10, head: !!fpCam.headTracking });
  }
  const worst = Math.max(...result.sweep.map((s) => Math.abs(s.camYaw - s.yaw)));
  result.sweepWorstDeg = worst;
  log(`sweep worst error ${worst.toFixed(2)}° · ${result.sweep.map((s) => `${s.yaw}→${s.camYaw}`).join(' ')}`);
  // Contract: no head pose -> null -> the gaze view (glasses unplugged).
  sim.unplug();
  result.afterUnplug = { head: glasses.xr.getHeadQuaternion(), status: glasses.driver.status };
  fpCam.update(world, 1 / 60);
  result.afterUnplug.cameraHeadTracking = fpCam.headTracking;
  sim.replug();
  await new Promise((r) => setTimeout(r, 1500));
  result.afterReplug = { status: glasses.driver.status, head: !!glasses.xr.getHeadQuaternion() };
  // A replug restarts the glasses' yaw reference: the driver recentred on its first pose (the
  // sweep's last yaw); face forward and recentre, as the player would (C).
  setHead(0, 0);
  glasses.recenter();
}

// 3) The picture to screenshot.
setHead(yawDeg, pitchDeg);
frame();
clearInterval(pump);
result.status = glasses.status().message;
result.cameraFov = app.camera.fov;
window.__xr = result;
log(`fov ${app.camera.fov.toFixed(1)}° · ${result.status}`);
// Draw the final frame again right before the screenshot (no preserveDrawingBuffer).
requestAnimationFrame(() => {
  frame();
  window.__ready = true;
});
</script>
</body>
</html>
